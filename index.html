<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: signup</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f6f5f2; color: #1d1d1b; }
    main { padding: 24px; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    p { margin: 0 0 24px; line-height: 1.5; }
    .cta {
      display: inline-block;
      white-space: nowrap;
      padding: 16px 48px;
      font-size: 20px;
      border: 0;
      border-radius: 8px;
      background: #2f5d50;
      color: #fff;
    }
    @media (max-width: 480px) {
      .cta { white-space: normal; max-width: 100%; box-sizing: border-box; padding: 16px 24px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Water the garden on time</h1>
    <p>A reminder an hour before the soil dries out, for every bed you plant.</p>
    <button class="cta">Start your free 30-day trial today</button>
  </main>
</body>
</html>
